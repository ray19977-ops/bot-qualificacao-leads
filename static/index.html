<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rai Bot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="pagina">
  <main class="chat">
    <header class="chat-cabecalho">
      <div class="chat-avatar" aria-hidden="true">R</div>
      <div>
        <h1 class="chat-titulo">Rai Bot</h1>
        <p class="chat-subtitulo">Assistente do Rai — automação de chatbots</p>
      </div>
    </header>

    <section id="mensagens" class="chat-mensagens" aria-live="polite" aria-label="Mensagens da conversa"></section>

    <form id="form-chat" class="chat-form" autocomplete="off">
      <input
        id="campo-mensagem"
        class="chat-campo"
        type="text"
        placeholder="Escreva sua mensagem…"
        aria-label="Sua mensagem"
        maxlength="1000"
        required
      >
      <button id="botao-enviar" class="chat-enviar" type="submit">Enviar</button>
    </form>
  </main>

  <aside id="painel-resumo" class="resumo" hidden aria-label="Resumo estruturado do lead">
    <h2 class="resumo-titulo">Resumo do lead</h2>
    <p class="resumo-descricao">Gerado automaticamente ao final da conversa.</p>
    <dl id="resumo-campos" class="resumo-campos"></dl>
  </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
