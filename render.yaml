# Blueprint do Render (ENTREGA-03): backend FastAPI + frontend estático
# no mesmo web service, tier gratuito (Arquitetura Seção 5).
services:
  - type: web
    name: bot-qualificacao-leads
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: TEST_LOG_MODE
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
